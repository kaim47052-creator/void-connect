name: Ошибка
description: Сообщить о воспроизводимой ошибке
title: "[Bug] "
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Платформа
      options: [Windows, Android, Обе платформы]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия ОС и commit приложения
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый и фактический результат
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Обезличенные логи или скриншоты
      description: Удалите секреты, токены и личные данные.
